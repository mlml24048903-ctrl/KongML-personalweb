<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="&#x5B54;&#x7C73;&#x4E50;&#x7684;&#x4E2A;&#x4EBA;&#x5DE5;&#x4F5C;&#x53F0;&#xFF1A;&#x4EA7;&#x54C1;&#x3001;&#x5F00;&#x53D1;&#x3001;&#x8BED;&#x8A00;&#x4E0E;&#x6301;&#x7EED;&#x751F;&#x957F;&#x7684;&#x60F3;&#x6CD5;&#x3002;" />
    <title>&#x5B54;&#x7C73;&#x4E50; / &#x60F3;&#x6CD5;&#x6301;&#x7EED;&#x751F;&#x957F;</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Crect width=%2764%27 height=%2764%27 rx=%2712%27 fill=%27%23060706%27/%3E%3Ccircle cx=%2732%27 cy=%2732%27 r=%2710%27 fill=%27%23d7ff24%27/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="./tokens.css?v=20260810ak" />
    <link rel="stylesheet" href="./styles.css?v=20260814b" />
  </head>
  <body>
    <svg class="crt-filter-defs" width="0" height="0" aria-hidden="true" focusable="false">
      <filter id="crtConvexLight" x="-3%" y="-3%" width="106%" height="106%" color-interpolation-filters="sRGB">
        <feImage href="./assets/crt-bulge-map.png?v=7" x="0" y="0" width="100%" height="100%" preserveAspectRatio="none" result="convexMap" />
        <feDisplacementMap in="SourceGraphic" in2="convexMap" scale="46" xChannelSelector="R" yChannelSelector="G" />
      </filter>
    </svg>
    <main id="app" class="app">
      <div class="ambient-grid" aria-hidden="true"></div>

      <div id="outsideTrack" class="outside-track">
      <div class="outside-panel outside-desk-panel">
      <section class="hero-copy" aria-labelledby="hero-title">
        <h1 id="hero-title">KEEP <br>BEING <br>AMBITIOUS.</h1>
      </section>
      <section id="computerStage" class="computer-stage" aria-label="&#x4EA4;&#x4E92;&#x5F0F;&#x4E2A;&#x4EBA;&#x7535;&#x8111;">
        <div id="outerItems" class="outer-items" aria-label="&#x5C4F;&#x5E55;&#x5916;&#x4FBF;&#x7B7E;&#x5C42;"></div>

        <div class="monitor-motion-shell">
        <div class="monitor-wrap">
          <div class="monitor">
            <div id="monitorScreen" class="monitor-screen">
              <section id="screenHome" class="screen-home" aria-label="&#x7535;&#x8111;&#x684C;&#x9762;">
                <div class="screen-grid" aria-hidden="true"></div>
                <div class="desktop-intro">
                  <span class="pixel-kicker">&#x6210;&#x957F;&#x6863;&#x6848; / &#x9009;&#x62E9;&#x76EE;&#x5F55;</span>
                  <strong>经历、实践与作品，持续写入。</strong>
                </div>
                <div class="desktop-icons">
                  <button class="desktop-icon" data-kind="folder" data-app="internships"><span class="pixel-icon pixel-folder"></span><span>实习经历</span></button>
                  <button class="desktop-icon" data-kind="folder" data-app="campus"><span class="pixel-icon pixel-folder"></span><span>校园经历</span></button>
                  <button class="desktop-icon" data-kind="folder" data-app="portfolio"><span class="pixel-icon pixel-folder"></span><span>作品集</span></button>
                </div>
                <div class="screen-status"><span>&#x6863;&#x6848; / 01</span><span>&#x6253;&#x5F00; / &#x8FFD;&#x8E2A; / &#x5C55;&#x5F00;</span></div>
              </section>

              <section id="retroOS" class="retro-os" aria-label="&#x590D;&#x53E4;&#x50CF;&#x7D20;&#x6587;&#x4EF6;&#x7CFB;&#x7EDF;">
                <div class="retro-wallpaper" aria-hidden="true"><span></span><span></span><span></span></div>
                <div class="retro-topbar"><span>&#x6210;&#x957F;&#x6863;&#x6848; / &#x76EE;&#x5F55; 01</span><span id="retroClock">12:00</span></div>
                <div id="retroDesktop" class="retro-desktop">
                  <div id="customInnerItems"></div>
                </div>
                <div id="windowLayer" class="window-layer" aria-live="polite"></div>

                <div class="retro-actions" aria-label="&#x6587;&#x4EF6;&#x64CD;&#x4F5C;">
                  <button id="newFile" type="button">+ &#x6587;&#x4EF6;</button>
                  <button id="newFolder" type="button">+ &#x6587;&#x4EF6;&#x5939;</button>
                </div>
                <div class="scanlines" aria-hidden="true"></div>
              </section>
            </div>
          </div>
          <div class="monitor-neck"></div>
          <div class="monitor-base"></div>
        </div>
        </div>

        <aside class="computer-tower" aria-label="&#x7535;&#x8111;&#x4E3B;&#x673A;"><div class="tower-slits"></div><button id="powerButton" class="tower-power" type="button" aria-label="&#x5207;&#x6362;&#x7535;&#x8111;&#x684C;&#x9762;&#x663E;&#x793A;&#x6A21;&#x5F0F;"></button><small>KML / 26</small></aside>
        <button id="enterMouse" class="mouse" type="button" aria-label="&#x70B9;&#x51FB;&#x9F20;&#x6807;&#x8FDB;&#x5165;&#x5DE5;&#x4F5C;&#x53F0;"><span class="mouse-wheel"></span><span class="mouse-glow"></span></button>
      </section>

      <button id="deskPrinter" class="desk-printer" type="button" aria-label="&#x70B9;&#x51FB;&#x6253;&#x5370;&#x5B54;&#x7C73;&#x4E50;&#x7684;&#x4E2A;&#x4EBA;&#x540D;&#x7247;">
        <span class="printer-shadow" aria-hidden="true"></span>
        <span class="printer-top" aria-hidden="true"><i></i><i></i></span>
        <span class="printer-shell" aria-hidden="true">
          <span class="printer-slot"></span>
          <span class="printer-controls"><i></i><i></i><i></i></span>
        </span>
      </button>
      <aside id="deskTrash" class="desk-trash" aria-label="&#x5C06;&#x540D;&#x7247;&#x62D6;&#x5165;&#x5783;&#x573E;&#x6876;&#x53EF;&#x4EE5;&#x5220;&#x9664;">
        <span class="trash-shadow" aria-hidden="true"></span>
        <span class="trash-lid" aria-hidden="true"></span>
        <span class="trash-body" aria-hidden="true"><i></i><i></i><i></i></span>
      </aside>
      <div id="businessCardLayer" class="business-card-layer" aria-label="&#x5DF2;&#x6253;&#x5370;&#x7684;&#x4E2A;&#x4EBA;&#x540D;&#x7247;"></div>
      <svg id="throwTrajectory" class="throw-trajectory" aria-hidden="true"><path></path></svg>
      <div id="confettiLayer" class="confetti-layer" aria-hidden="true"></div>
      </div>

      <section id="feltBoard" class="outside-panel felt-board" aria-labelledby="feltBoardTitle" aria-hidden="true">
        <h2 id="feltBoardTitle" class="sr-only">可编辑的毛毡留言墙</h2>
        <div class="felt-canvas-shell">
          <canvas id="feltCanvas" aria-label="毛毡留言墙：撕取便签、编辑内容、拖动并用图钉固定"></canvas>
          <button id="feltTearButton" class="felt-canvas-hotspot" type="button">撕下一张便签</button>
          <button id="feltPinButton" class="felt-canvas-hotspot" type="button">取出一枚图钉</button>
        </div>
      </section>
      </div>

      <aside id="workspaceToolbar" class="workspace-toolbar" aria-label="&#x4FBF;&#x7B7E;&#x5DE5;&#x5177;&#x680F;" hidden>
        <button id="addNote" type="button"><span class="tool-glyph">&#x25B0;</span>&#x4FBF;&#x7B7E;</button>
        <div class="toolbar-divider"></div>
        <button id="resetWorkspace" class="muted-action" type="button">&#x91CD;&#x7F6E;&#x672C;&#x5730;&#x5185;&#x5BB9;</button>
      </aside>

      <aside id="modeGuide" class="mode-guide" hidden>
        <span id="modeLabel">&#x5C4F;&#x5E55;&#x5916;&#x6A21;&#x5F0F;</span>
        <p id="modeDescription">点击文件夹或鼠标进入屏幕，滑动前往留言</p>
      </aside>

      <div id="zoomMeter" class="zoom-meter" aria-hidden="true"><span></span><small>&#x6EDA;&#x52A8;&#x5207;&#x6362;&#x7A7A;&#x95F4;</small></div>

      <dialog id="feltEditor" class="felt-editor">
        <form method="dialog" id="feltEditorForm">
          <header>
            <div><span>MESSAGE / EDIT</span><h2>编辑留言</h2></div>
            <button id="feltEditorClose" type="button" aria-label="关闭编辑器">×</button>
          </header>
          <div class="felt-editor-modes" role="tablist" aria-label="留言类型">
            <button id="feltTabMarkdown" type="button" role="tab" data-felt-mode="md" aria-selected="true" aria-controls="feltMarkdownField" tabindex="0">Markdown</button>
            <button id="feltTabDoodle" type="button" role="tab" data-felt-mode="doodle" aria-selected="false" aria-controls="feltDoodleField" tabindex="-1">涂鸦</button>
            <button id="feltTabImage" type="button" role="tab" data-felt-mode="image" aria-selected="false" aria-controls="feltImageField" tabindex="-1">图片</button>
          </div>
          <div class="felt-editor-pages">
            <label id="feltMarkdownField" class="felt-editor-page felt-markdown-field" role="tabpanel" aria-labelledby="feltTabMarkdown">留言内容
              <textarea id="feltMarkdown" rows="9" maxlength="600" placeholder="# 写下一句话&#10;&#10;- 也可以使用简单的 Markdown"></textarea>
            </label>
            <section id="feltDoodleField" class="felt-editor-page felt-doodle-field" role="tabpanel" aria-labelledby="feltTabDoodle" hidden>
              <div><button id="feltDoodleClear" type="button" aria-label="清空涂鸦">清空</button></div>
              <canvas id="feltDoodleCanvas" width="720" height="720" aria-label="留言涂鸦画布"></canvas>
            </section>
            <section id="feltImageField" class="felt-editor-page felt-image-field" role="tabpanel" aria-labelledby="feltTabImage" hidden>
              <label id="feltImageDropzone" class="felt-image-upload"><span>拖入图片或点击选择</span><small>JPG、PNG、WEBP</small><input id="feltImageInput" type="file" accept="image/*"></label>
              <div id="feltImagePreview" class="felt-image-preview" hidden></div>
            </section>
          </div>
          <fieldset class="felt-paper-colors">
            <legend>纸张颜色</legend>
            <label><input type="radio" name="feltColor" value="yellow" checked><span class="is-yellow">黄</span></label>
            <label><input type="radio" name="feltColor" value="blue"><span class="is-blue">蓝</span></label>
            <label><input type="radio" name="feltColor" value="pink"><span class="is-pink">粉</span></label>
            <label><input type="radio" name="feltColor" value="mint"><span class="is-mint">薄荷</span></label>
            <label><input type="radio" name="feltColor" value="lavender"><span class="is-lavender">紫</span></label>
            <label><input type="radio" name="feltColor" value="bone"><span class="is-bone">米白</span></label>
            <label><input type="radio" name="feltColor" value="coral"><span class="is-coral">橙</span></label>
            <label class="felt-custom-color"><input type="radio" name="feltColor" value="custom"><span>自定</span><input id="feltCustomColor" type="color" value="#f6d365" aria-label="自定义便签颜色"></label>
          </fieldset>
          <footer><button id="feltEditorDelete" class="felt-editor-delete" type="button" hidden>删除便签</button><span class="felt-editor-footer-spacer"></span><button id="feltEditorCancel" type="button">取消</button><button class="felt-editor-save" value="default">放到留言墙</button></footer>
        </form>
      </dialog>

      <dialog id="itemDialog" class="item-dialog">
        <form method="dialog" id="itemForm">
          <header>
            <div><span class="pixel-kicker">&#x672C;&#x5730;&#x7F16;&#x8F91;&#x5668;</span><h2 id="dialogTitle">&#x65B0;&#x5EFA;&#x4FBF;&#x7B7E;</h2></div>
            <button type="button" class="dialog-close" aria-label="&#x5173;&#x95ED;">&#x00D7;</button>
          </header>
          <label>&#x6807;&#x9898;<input id="itemTitle" name="title" maxlength="40" required /></label>
          <label>&#x5185;&#x5BB9;<textarea id="itemContent" name="content" maxlength="600" rows="7"></textarea></label>
          <div id="colorField" class="color-field">
            <span>&#x989C;&#x8272;</span>
            <label><input type="radio" name="color" value="lime" checked /><i class="lime"></i></label>
            <label><input type="radio" name="color" value="orange" /><i class="orange"></i></label>
            <label><input type="radio" name="color" value="bone" /><i class="bone"></i></label>
          </div>
          <section id="noteMediaTools" class="note-media-tools" aria-label="&#x4FBF;&#x7B7E;&#x56FE;&#x7247;&#x4E0E;&#x6D82;&#x9E26;">
            <div class="note-media-row">
              <label class="media-upload">&#x5BFC;&#x5165;&#x56FE;&#x7247;<input id="noteImageInput" type="file" accept="image/*" /></label>
              <button id="clearNoteImage" type="button" class="media-ghost">&#x79FB;&#x9664;&#x56FE;&#x7247;</button>
            </div>
            <div id="noteImagePreview" class="note-image-preview" hidden></div>
            <div class="doodle-heading"><span>&#x76F4;&#x63A5;&#x6D82;&#x9E26;</span><button id="clearDoodle" type="button" class="media-ghost">&#x6E05;&#x7A7A;</button></div>
            <canvas id="noteDoodle" width="640" height="320" aria-label="&#x4FBF;&#x7B7E;&#x6D82;&#x9E26;&#x753B;&#x5E03;"></canvas>
          </section>
          <footer><button type="button" class="dialog-secondary dialog-close">&#x53D6;&#x6D88;</button><button id="saveItem" value="default" class="dialog-primary">&#x4FDD;&#x5B58;&#x5230;&#x5DE5;&#x4F5C;&#x53F0;</button></footer>
        </form>
      </dialog>

      <div id="toast" class="toast" role="status" aria-live="polite"></div>
    </main>
    <script src="./assets/vendor/html-to-image.js?v=1.11.13"></script>
    <script src="./felt-board.js?v=20260814a"></script>
    <script src="./app.js?v=20260814a"></script>
  </body>
</html>
